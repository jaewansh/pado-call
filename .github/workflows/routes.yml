# Scratch branch job: screenshots of the live demo with the real map (tiles need internet).
name: app screenshots
on:
  push:
    branches: [routes-data]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji > /dev/null
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
      - run: python tools/readme_shots.py
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A shots3
          git diff --cached --quiet || { git commit -m "README 화면 캡처 (실제 지도)"; git push; }
